name: her_space
description: "A soft, girly personal space Flutter assignment."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFF9F7"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#FFF9F7"
    theme_color: "#E8A8BF"

flutter_native_splash:
  color: "#FFF9F7"
  color_dark: "#FFF9F7"
  image: "assets/branding/splash_icon.png"
  image_dark: "assets/branding/splash_icon.png"
  branding: "assets/branding/splash_branding.png"
  branding_mode: bottom
  android_12:
    image: "assets/branding/splash_icon_android12.png"
    image_dark: "assets/branding/splash_icon_android12.png"
    color: "#FFF9F7"
    color_dark: "#FFF9F7"
    branding: "assets/branding/splash_branding.png"
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
